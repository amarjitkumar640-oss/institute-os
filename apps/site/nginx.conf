# Caddy proxies straight through to this container for the bare domain
# (thesuccess.in), so no path-prefix stripping is needed here — see
# infra/Caddyfile.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html is what changes on every deploy of this plain static site
    # (no hashed filenames here, unlike apps/web's Vite build), so it
    # shouldn't be cached by the browser — without this, a visitor could
    # keep seeing a stale page indefinitely. Content management now lives in
    # apps/web (staff login), not a second page on this site.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
