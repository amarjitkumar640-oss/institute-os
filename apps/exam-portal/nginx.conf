# Caddy strips the /exams prefix before proxying here (see
# infra/Caddyfile), so this only ever sees paths relative to the app's own
# root — it doesn't need to know about that prefix at all.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames (index-<hash>.js/.css) change on every build, so it's
    # safe for browsers to cache these forever without ever re-checking.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html itself is what points at those hashed filenames, so it must
    # never be cached the same way — without this, a browser can keep
    # serving a stale index.html (referencing assets from a previous
    # deploy) indefinitely, since nginx's default response here carries no
    # Cache-Control header at all for the browser to key a re-check off of.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
