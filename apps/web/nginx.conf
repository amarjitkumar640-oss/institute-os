# Caddy strips the /qa (or whatever) prefix before proxying here (see
# infra/Caddyfile), so this only ever sees paths relative to the app's own
# root — it doesn't need to know about that prefix at all.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
