services:
  api:
    image: ghcr.io/amarjitkumar640-oss/institute-os-api:latest
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
    expose:
      - "4000"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: institute
      POSTGRES_DB: institute_os
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # deliberately no "ports:" — unreachable from outside this Docker network

  # Standalone marketing site (apps/site) for thesuccess.in — plain static
  # nginx, no env_file needed since it has no server-side config of its own;
  # all its dynamic data comes from api at request time via relative /api/*
  # calls (see infra/Caddyfile).
  site:
    image: ghcr.io/amarjitkumar640-oss/institute-os-site:latest
    restart: always
    expose:
      - "80"

  # Staff portal (apps/web) — one shared multi-tenant build, deployed here
  # with no path prefix under thesuccess.in for now (see infra/Caddyfile's
  # comment on this tradeoff). No env_file: same as web-qa, it has no
  # server-side config — VITE_API_URL is baked in at build time instead.
  web:
    image: ghcr.io/amarjitkumar640-oss/institute-os-web:latest
    restart: always
    expose:
      - "80"

  # Government Exam Intelligence public portal (apps/exam-portal) — same
  # shape as web/site: no env_file, VITE_API_URL/BASE_PATH baked in at
  # build time. Served at /exams/* via infra/Caddyfile.
  exam-portal:
    image: ghcr.io/amarjitkumar640-oss/institute-os-exam-portal:latest
    restart: always
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - site
      - web
      - exam-portal

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
