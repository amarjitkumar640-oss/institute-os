services:
  api:
    image: ghcr.io/amarjitkumar640-oss/institute-os-api:latest
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
    expose:
      - "4000"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: institute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: institute_os
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # deliberately no "ports:" — unreachable from outside this Docker network

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
